[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-pack-manager"
version = "0.1.0"
description = "Choose which agent skills and MCP servers each project gets, for Claude Code, OpenCode and Codex"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []
keywords = ["claude-code", "opencode", "codex", "agent-skills", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Environment :: Web Environment",
]

[project.scripts]
skill-pack-manager = "spm.__main__:main"
spm = "spm.__main__:main"

[tool.setuptools]
packages = ["spm"]

[tool.setuptools.package-data]
spm = ["static/*"]

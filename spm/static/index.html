<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Skill Pack Manager</title>
<link rel="icon" href="/icon.png">
<script>(() => { const r = document.documentElement, p = r.dataset.themePref;
  r.dataset.theme = p === "dark" || (p !== "light" && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; })();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --bg: #f6f7f9; --panel: #fff; --panel2: #f0f2f5; --fg: #1d2330; --muted: #667085;
  --line: #e3e6eb; --accent: #3b5bdb; --accent-fg: #fff; --ok: #2b8a3e; --warn: #d9480f;
  --bad: #c92a2a; --info: #1971c2; --chip: #e9edf5; --radius: 8px;
  font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; color-scheme: light;
}
/* data-theme holds the resolved theme (light|dark); JS sets it from the saved choice */
:root[data-theme=dark] { --bg: #14171c; --panel: #1b1f26; --panel2: #232831; --fg: #e6e8ec; --muted: #9aa3b2;
  --line: #2d333d; --accent: #5c7cfa; --chip: #2a303b; --ok: #51cf66; --warn: #ff922b;
  --bad: #ff6b6b; --info: #4dabf7; color-scheme: dark; }
.theme svg { width: 15px; height: 15px; vertical-align: -3px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.theme button { display: inline-flex; align-items: center; gap: 5px; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); height: 100vh; display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 16px; padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; margin: 0; font-weight: 600; }
nav { display: flex; gap: 4px; }
nav button { background: none; border: none; padding: 7px 14px; border-radius: 6px; color: var(--muted); cursor: pointer; font: inherit; }
nav button[aria-pressed=true] { background: var(--panel2); color: var(--fg); font-weight: 600; }
.spacer { flex: 1; }
main { flex: 1; display: grid; grid-template-columns: 360px 1fr; min-height: 0; }
main.wide { grid-template-columns: 1fr; }
.list { border-right: 1px solid var(--line); overflow: auto; background: var(--panel); }
.detail { overflow: auto; padding: 20px 26px; }
.listtools { position: sticky; top: 0; background: var(--panel); padding: 10px; display: flex; gap: 6px; border-bottom: 1px solid var(--line); z-index: 1; }
.item { padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.item:hover { background: var(--panel2); }
.item.sel { background: var(--panel2); box-shadow: inset 3px 0 0 var(--accent); }
.item .t { font-weight: 600; display: flex; align-items: center; gap: 6px; }
.item .p { color: var(--muted); font-size: 12px; margin-top: 2px; word-break: break-all; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.chip { background: var(--chip); border-radius: 12px; padding: 2px 9px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
.chip button { border: none; background: none; color: var(--muted); cursor: pointer; padding: 0 0 0 2px; font-size: 13px; line-height: 1; }
.chip button:hover { color: var(--bad); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.badge { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.b-ok { color: var(--ok); } .b-warn { color: var(--warn); } .b-bad { color: var(--bad); } .b-info { color: var(--info); }
input, select { font: inherit; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); min-width: 0; }
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.btn { font: inherit; padding: 6px 13px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--panel2); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
h2 { font-size: 18px; margin: 0 0 4px; word-break: break-all; }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 26px 0 8px; }
.muted { color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
table { border-collapse: collapse; width: 100%; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); }
td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.desc { color: var(--muted); font-size: 12px; max-width: 520px; }
.empty { color: var(--muted); padding: 40px; text-align: center; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.stats { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 14px; min-width: 100px; }
.stat b { display: block; font-size: 18px; }
.stat span { font-size: 12px; color: var(--muted); }
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 10; }
#modal .box { background: var(--panel); border-radius: 10px; width: min(760px, 92vw); max-height: 84vh; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
#modal .body { padding: 18px 22px; overflow: auto; }
#modal .foot { padding: 12px 22px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }
.plan { margin-bottom: 14px; }
.plan .f { font-weight: 600; word-break: break-all; }
.plan ul { margin: 4px 0 0; padding-left: 20px; }
#toast { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 20; }
#toast div { background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 8px; max-width: 460px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
#toast div.err { background: var(--bad); color: #fff; }
.legend { font-size: 12px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: none; background: var(--panel); padding: 6px 11px; font: inherit; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed=true] { background: var(--panel2); color: var(--fg); font-weight: 600; }
#lost { background: var(--bad); color: #fff; padding: 10px 18px; display: flex; gap: 14px; align-items: center; justify-content: space-between; font-weight: 600; }
#lost .btn { color: var(--fg); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
textarea { font: inherit; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); }
.bulkbar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 14px; margin: 0 0 10px; background: var(--panel); border: 1px solid var(--accent); border-radius: var(--radius); box-shadow: 0 2px 8px rgba(0,0,0,.12); }
tr.picked td { background: color-mix(in srgb, var(--accent) 10%, transparent); }
code.ver { font-size: 12px; background: var(--chip); padding: 1px 6px; border-radius: 4px; }
.toggles { display: inline-flex; gap: 4px; }
.tgl { font: inherit; font-size: 11px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; }
.tgl.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.reflist { display: flex; flex-direction: column; gap: 4px; max-height: 50vh; overflow: auto; margin-bottom: 10px; }
.refrow { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
.refrow:hover { background: var(--panel2); }
.skillpick { padding: 8px 0; border-bottom: 1px solid var(--line); }
pre.preview { background: var(--panel2); padding: 10px; border-radius: 6px; max-height: 300px; overflow: auto; white-space: pre-wrap; font-size: 12px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 10px 0; }
.card.choice { text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 6px; font: inherit; color: var(--fg); }
.card.choice.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; font-size: 12px; color: var(--muted); }
.field > input, .field > select, .field > textarea { font-size: 14px; color: var(--fg); }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 110px; padding: 8px 10px 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); max-width: 620px; }
.bars .bar { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px; }
.bars .bar span { font-size: 11px; color: var(--muted); }
.bars .bar i { display: block; width: 100%; min-height: 2px; background: var(--accent); border-radius: 3px 3px 0 0; }
.costline { font-size: 12px; color: var(--muted); margin-top: 4px; }
pre.diff { background: var(--panel2); padding: 8px 10px; border-radius: 6px; max-height: 360px; overflow: auto; font-size: 12px; margin: 6px 0 10px; white-space: pre; }
pre.diff .add { color: var(--ok); } pre.diff .del { color: var(--bad); } pre.diff .hunk { color: var(--info); }
.finding { font-size: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.finding code { display: block; white-space: pre-wrap; word-break: break-all; background: var(--panel2); padding: 3px 6px; border-radius: 4px; margin-top: 3px; }
</style>
</head>
<body>
<header>
  <h1>Skill Pack Manager</h1>
  <nav id="nav"></nav>
  <div class="spacer"></div>
  <span class="muted" id="cfg" style="font-size:12px"></span>
  <div class="seg theme" id="theme" role="group" aria-label="Color theme">
    <button data-theme-opt="light" title="Light mode"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Light</button>
    <button data-theme-opt="dark" title="Dark mode"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Dark</button>
    <button data-theme-opt="system" title="Follow the Windows setting"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>System</button>
  </div>
  <button class="btn" id="reload" title="Reload from disk">Reload</button>
</header>
<main id="main"><div class="list" id="list"></div><div class="detail" id="detail"></div></main>
<div id="modal"><div class="box"><div class="body" id="mbody"></div><div class="foot" id="mfoot"></div></div></div>
<div id="toast"></div>
<datalist id="skilllist"></datalist>
<datalist id="mcplist"></datalist>
<script>
"use strict";
const TOKEN = new URLSearchParams(location.hash.slice(1)).get("t") || "";
const S = { tab: "folders", state: null, folder: null, pack: null, folderView: null,
            filter: "", skillFilter: "all", skillQuery: "", scan: null, scanOnlyMissing: true, scanWorktrees: false, newFolder: null, selected: new Set(), lastPick: null,
            insights: null, usageDays: 60, usageQuery: "", usageUnused: false, dismissed: new Set() };

// ---------------------------------------------------------------- helpers
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "class") e.className = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k instanceof Node ? k : String(k));
  return e;
}
const $ = id => document.getElementById(id);
const fill = (el, ...kids) => el.replaceChildren(...kids.flat().filter(k => k != null && k !== false));
const base = p => p.replace(/[\\/]+$/, "").split(/[\\/]/).pop();
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

const LOST = "The Skill Pack Manager background process is not running. Close this window and start the app again.";
function showDisconnected() {
  if ($("lost")) return;
  document.body.prepend(h("div", { id: "lost", role: "alert" }, LOST,
    h("button", { class: "btn", onclick: () => location.reload() }, "Try again")));
}
async function api(path, body) {
  let r;
  try {
    r = await fetch(path, { method: body ? "POST" : "GET",
      headers: { "X-SPM-Token": TOKEN, "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined });
  } catch (e) {  // network error: the local server is gone
    showDisconnected();
    throw new Error(LOST);
  }
  if ($("lost")) $("lost").remove();
  const j = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}
function toast(msg, err) {
  const d = h("div", { class: err ? "err" : "" }, msg);
  $("toast").append(d);
  setTimeout(() => d.remove(), err ? 9000 : 4500);
}
async function guard(fn) { try { await fn(); } catch (e) { toast(e.message, true); } }

// ------------------------------------------------------------- operations
function planChanges(res) {
  return res.plans.reduce((n, p) => n + p.add.length + p.remove.length + p.mcp_add.length + p.mcp_remove.length, 0);
}
function skillsOf(list) { return [...new Set(list.map(x => x[1]))]; }
const CLIENT_LABEL = { claude: "Claude", opencode: "OpenCode", codex: "Codex" };
function mcpByServer(list) {
  const m = {};
  for (const [c, n] of list) (m[n] = m[n] || []).push(CLIENT_LABEL[c]);
  return Object.entries(m).map(([n, cs]) => `${n} (${cs.join(", ")})`);
}

// A modal with buttons. buttons: [{label, primary, danger, run}] where run is an
// async action; the modal closes with run's result unless it returns false.
// The first button is the cancel button (Escape clicks it).
function openModal(title, content, buttons, wide) {
  fill($("mbody"), h("h2", {}, title), ...content);
  $("modal").querySelector(".box").style.width = wide ? "min(980px, 94vw)" : "";
  return new Promise(resolve => {
    const close = v => { $("modal").style.display = "none"; resolve(v); };
    fill($("mfoot"), ...buttons.map(b => {
      const el = h("button", { class: "btn" + (b.primary ? " primary" : "") + (b.danger ? " danger" : "") }, b.label);
      el.onclick = async () => {
        if (!b.run) return close(b.value ?? false);
        const label = el.textContent;
        for (const x of $("mfoot").children) x.disabled = true;
        el.textContent = b.busy || "Working…";
        try { const r = await b.run(); if (r !== false) close(r ?? true); }
        catch (err) { toast(err.message, true); }
        finally { el.textContent = label; for (const x of $("mfoot").children) x.disabled = false; }
      };
      return el;
    }));
    $("modal").style.display = "flex";
  });
}

function showPreview(res, title) {
  const body = $("mbody"); fill(body, h("h2", {}, title));
  for (const w of res.warnings) body.append(h("p", { class: "b-warn" }, w));
  for (const p of res.plans) {
    // links in .skill-packs/ come from an earlier router layout and are only removed;
    // skills behind a router now live inside it (p.routed lists them)
    const HID = ".skill-packs";
    const vis = l => skillsOf(l.filter(x => x[0] !== HID)), hid = l => skillsOf(l.filter(x => x[0] === HID));
    const addV = vis(p.add), addH = hid(p.add), remV = vis(p.remove), remH = hid(p.remove);
    const routedNow = p.routed || [];
    const behind = remV.filter(s => routedNow.includes(s)), back = remH.filter(s => addV.includes(s));
    const add = addV.filter(s => !back.includes(s)), rem = remV.filter(s => !behind.includes(s));
    const addHid = addH, remHid = remH.filter(s => !back.includes(s));
    const box = h("div", { class: "plan" }, h("div", { class: "f" }, p.folder));
    const ul = h("ul");
    if (add.length) ul.append(h("li", { class: "b-ok" }, `link ${plural(add.length, "skill")}: ${add.join(", ")}`));
    if (rem.length) ul.append(h("li", { class: "b-bad" }, `unlink ${plural(rem.length, "skill")}: ${rem.join(", ")}`));
    if (behind.length) ul.append(h("li", { class: "b-info" }, `move behind the router (agents stop listing them): ${behind.join(", ")}`));
    if (back.length) ul.append(h("li", { class: "b-info" }, `bring back from behind the router: ${back.join(", ")}`));
    if (addHid.length) ul.append(h("li", { class: "b-ok" }, `add behind the router: ${addHid.join(", ")}`));
    if (remHid.length) ul.append(h("li", { class: "b-bad" }, `clean up old .skill-packs links: ${remHid.join(", ")}`));
    for (const c of p.conflicts) ul.append(h("li", { class: "b-warn" }, `${c[0]}/${c[1]}: the project has its own ${c[2] === "own" ? "folder" : "link"} with this name, left as is`));
    if (p.missing.length) ul.append(h("li", { class: "b-warn" }, `not in the store, skipped: ${p.missing.join(", ")}`));
    for (const w of p.warnings) ul.append(h("li", { class: "b-warn" }, w));
    const madd = mcpByServer(p.mcp_add), mrem = mcpByServer(p.mcp_remove);
    if (madd.length) ul.append(h("li", { class: "b-ok" }, `add MCP: ${madd.join("; ")}`));
    if (mrem.length) ul.append(h("li", { class: "b-bad" }, `remove MCP: ${mrem.join("; ")}`));
    for (const c of p.mcp_conflicts) ul.append(h("li", { class: "b-warn" }, c[2] === "locked"
      ? `MCP ${c[1]} for ${CLIENT_LABEL[c[0]]}: the config file is tracked by git, left as is`
      : `MCP ${c[1]} for ${CLIENT_LABEL[c[0]]}: the project defines its own entry with this name, left as is`));
    if (p.mcp_missing.length) ul.append(h("li", { class: "b-warn" }, `MCP not in the catalog, skipped: ${p.mcp_missing.join(", ")}`));
    for (const w of p.mcp_warnings) ul.append(h("li", { class: "b-warn" }, w));
    if (!ul.children.length) ul.append(h("li", { class: "muted" }, "no changes"));
    box.append(ul); body.append(box);
  }
  body.append(h("p", { class: "muted", style: "font-size:12px" },
    "Each skill is linked into .claude/skills, .opencode/skills and .agents/skills. Unlinking removes only the link; the skill in the store is never touched. " +
    "MCP servers go to Claude (local scope, through the claude CLI), .opencode/opencode.json and .codex/config.toml. Only entries whose name is in the catalog, in files git does not track, are ever removed."));
  const nodes = [...body.childNodes].slice(1);
  return openModal(title, nodes, [{ label: "Cancel" }, { label: "Apply", primary: true, value: true }]);
}

async function op(name, args, title) {
  let applied = false;
  await guard(async () => {
    const pre = await api("/api/op", { op: name, args, dry: true });
    if (planChanges(pre) || pre.warnings.length || pre.plans.some(p => p.conflicts.length || p.mcp_conflicts.length || p.mcp_warnings.length)) {
      if (!await showPreview(pre, title)) return;
    }
    const res = await api("/api/op", { op: name, args, dry: false });
    const n = planChanges(res);
    if (res.errors.length) toast(`${title}: saved, but some changes failed (Sync retries them): ${res.errors.join(" | ")}`, true);
    else toast(`${title}: done${n ? `, ${plural(n, "change")}` : ""}`);
    applied = true;
    await refresh();
  });
  return applied;
}

// ---------------------------------------------------------------- loading
async function refresh() {
  S.state = await api("/api/state");
  $("cfg").textContent = S.state.config.packs;
  fill($("skilllist"), ...S.state.skills.map(s => h("option", { value: s.dir }, s.description.slice(0, 90))));
  fill($("mcplist"), ...S.state.mcp.map(m => h("option", { value: m.name }, m.url || [m.command, ...m.args].join(" ").slice(0, 90))));
  if (S.folder && S.tab === "folders") S.folderView = await api("/api/folder?path=" + encodeURIComponent(S.folder));
  if (S.tab === "usage") S.insights = await api(`/api/insights?days=${S.usageDays}`);
  else S.insights = null;  // costs change with every operation; fetched again on the tab
  render();
  if (!S.state.settings.mode && !S.firstRunShown) { S.firstRunShown = true; firstRun(); }
  maybeCheckUpdates();
}

// ------------------------------------------------------------------ views
const TABS = [["folders", "Folders"], ["packs", "Packs"], ["skills", "Skills"], ["mcp", "MCP servers"], ["usage", "Usage"], ["scan", "Find projects"], ["settings", "Settings"]];
function renderNav() {
  fill($("nav"), ...TABS.map(([k, label]) =>
    h("button", { "aria-pressed": String(S.tab === k), onclick: () => { S.tab = k; S.filter = ""; S.skillQuery = ""; render(); if (k === "scan" && !S.scan) runScan(); if (k === "usage" && !S.insights) loadInsights(); } }, label)));
}
function render() {
  renderNav();
  $("main").className = ["skills", "mcp", "usage", "scan", "settings"].includes(S.tab) ? "wide" : "";
  $("list").style.display = $("main").className ? "none" : "";
  ({ folders: renderFolders, packs: renderPacks, skills: renderSkills, mcp: renderMcp, usage: renderUsage, scan: renderScan, settings: renderSettings })[S.tab]();
}

function statusDot(f) {
  const c = !f.exists ? "var(--muted)" : f.in_sync && !f.counts.conflict ? "var(--ok)" : "var(--warn)";
  const t = !f.exists ? "folder missing" : f.in_sync ? (f.counts.conflict ? "has name conflicts" : "in sync") : "out of sync";
  return h("span", { class: "dot", style: `background:${c}`, title: t });
}

function listTools(placeholder, extra) {
  const inp = h("input", { placeholder, value: S.filter, style: "flex:1",

async function selectFolder(path) {
  S.folder = path; S.newFolder = null;
  await guard(async () => { S.folderView = await api("/api/folder?path=" + encodeURIComponent(path)); render(); });
}

async function addFolder() {
  await guard(async () => {
    const r = await api("/api/pick-folder", { start: S.folder || "D:\\Projects" });
    if (r.folder) await openFolder(r.folder);
  });
}
async function openFolder(path) {
  path = path.trim().replace(/^"|"$/g, "").replace(/[\\/]+$/, "");
  if (!path) return;
  const known = S.state.folders.find(f => f.folder.toLowerCase() === path.toLowerCase());
  if (known) return selectFolder(known.folder);
  const v = await api("/api/folder?path=" + encodeURIComponent(path));
  if (!v.exists) throw new Error(`Folder not found: ${path}`);
  S.folder = path; S.newFolder = path; S.folderView = v;
  render();
}
function pathInput() {
  const example = S.state.platform === "windows" ? "C:\\Users\\you\\Projects\\my-game" : "/home/you/projects/my-game";
  const inp = h("input", { placeholder: `or paste a folder path, e.g. ${example}`, style: "width:380px" });
  const go = () => guard(() => openFolder(inp.value));
  inp.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  return h("div", { class: "row", style: "margin-top:16px" },
    h("button", { class: "btn primary", onclick: addFolder }, "Choose folder…"), inp, h("button", { class: "btn", onclick: go }, "Open"));
}

function packSelect(exclude, preferred) {
  const opts = S.state.packs.map(p => p.name).filter(n => !exclude.includes(n));
  const sel = h("select", {}, ...opts.map(n => h("option", { value: n, selected: n === preferred }, n)));
  return [sel, opts.length];
}

function adder(list, placeholder, label, onAdd) {
  const inp = h("input", { list, placeholder, style: "width:280px" });
  const go = () => { const v = inp.value.trim(); if (v) onAdd(v); };
  inp.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  return h("div", { class: "row" }, inp, h("button", { class: "btn", onclick: go }, label));
}

function guessPack(folder) {
  const proj = (S.scan || []).find(p => p.folder.toLowerCase() === folder.toLowerCase());
  return proj && proj.suggested && proj.suggested.length ? proj.suggested[0].pack : undefined;
}

  "codex-cli": "Codex (your subscription)", "anthropic": "Anthropic API key", "openai": "OpenAI API key" };

async function editRouter(p) {
  const r = p.router;
  let draft = r.enabled ? { description: r.description, routing: r.routing, descriptions: r.descriptions, writer: r.writer || "template" } : null;
  await guard(async () => {
    if (!draft) draft = await api("/api/router/draft", { pack: p.name, writer: "template" });
  });
  if (!draft) return;
  const snapshot = (d, routing) => JSON.stringify([d.trim(), p.skills.map(s => (routing[s] || (draft.descriptions || {})[s] || "").trim())]);
  let generated = snapshot(draft.description, draft.routing || {});
  const mode = r.enabled ? r.mode : "instead";
  const modeSel = h("select", {}, h("option", { value: "instead", selected: mode === "instead" }, "Instead of the skills (saves tokens)"),
    h("option", { value: "alongside", selected: mode === "alongside" }, "Alongside the skills"));
  const desc = h("textarea", { rows: 5, style: "width:100%", maxlength: "1024" });
  const count = h("span", { class: "muted", style: "font-size:12px" });
  const upd = () => { count.textContent = `${desc.value.length} / 1024`; };
  desc.addEventListener("input", upd);
  const lines = {};
  const table = h("table", {}, h("tbody", {}, ...p.skills.map(s => {
    lines[s] = h("input", { style: "width:100%" });
    return h("tr", {}, h("td", { style: "white-space:nowrap; width:1%" }, h("b", {}, s)), h("td", {}, lines[s]));
  })));
  const note = h("textarea", { rows: 2, style: "width:100%", placeholder: "optional: extra guidance for the agent, e.g. which skill to prefer" });
  note.value = r.note || "";
  const descs = draft.descriptions || {};
  const setFields = d => { desc.value = d.description; for (const s of p.skills) lines[s].value = (d.routing || {})[s] || descs[s] || ""; upd(); };
  setFields(draft);
  const writerSel = h("select", {}, ...writersAvailable().map(w => h("option", { value: w, selected: w === S.state.settings.ai.writer }, WRITER_LABEL[w])));
  let writer = draft.writer || "template";
  const genBtn = h("button", { class: "btn", onclick: () => guard(async () => {
    genBtn.disabled = true; genBtn.textContent = "Writing…";
    try {
      const d = await api("/api/router/draft", { pack: p.name, writer: writerSel.value });
      setFields(d); writer = d.writer; generated = snapshot(d.description, d.routing);
      toast(`Written with: ${WRITER_LABEL[d.writer]}`);
    } finally { genBtn.disabled = false; genBtn.textContent = "Write"; }
  }) }, "Write");
  const result = await openModal(`${r.enabled ? "Edit" : "Create"} router for ${p.name}`, [
    h("p", { class: "muted" }, `The router is an index skill named using-${p.name} (invoked as /using-${p.name}). Agents decide from its description whether to open it, so name the tasks and the words a user would type. Its index lists every skill A to Z with its description; it then tells the agent to read the one that fits and follow it.`),
    h("label", { class: "field" }, "Mode", modeSel),
    h("div", { class: "row", style: "margin-bottom:10px" }, h("span", { class: "muted", style: "font-size:12px" }, "Write the text with:"), writerSel, genBtn,
      writersAvailable().length === 1 ? h("span", { class: "muted", style: "font-size:12px" }, "Add an API key or install the Claude/Codex CLI to write with AI (Settings).") : null),
    h("label", { class: "field" }, h("span", { class: "row" }, "Description ", count), desc),
    h("h3", {}, "Index entry for each skill"),
    h("p", { class: "muted", style: "font-size:12px" }, "Starts as the skill's own description and follows it when the skill is updated. Change a line only to say something the description doesn't."), table,
    h("label", { class: "field", style: "margin-top:10px" }, "Note", note),
  ], [{ label: "Cancel" }, { label: "Save router", primary: true, run: async () => {
    if (!desc.value.trim()) throw new Error("The description cannot be empty");
    const routing = Object.fromEntries(p.skills.map(s => [s, lines[s].value.trim()]));
    const edited = snapshot(desc.value, routing) !== generated;
    return { pack: p.name, mode: modeSel.value, description: desc.value.trim(), routing, note: note.value, writer, edited };
  } }], true);
  if (result && result.pack) await op("router_set", result, `Save router using-${p.name}`);
}

function aiSettings(ai) {

  writer.addEventListener("change", () => guard(async () => { await api("/api/settings", { ai: { writer: writer.value } }); await refresh(); }));

  return h("div", {},
    h("h3", {}, "Writing pack routers"),

      ...[["Packs", st.config.packs], ["Skill store", st.config.store], ["Data folder (settings, catalog, backups, log)", st.config.data]].map(([k, v]) =>

async function migrateFromCcSwitch() {
  await guard(async () => {
    const p = await api("/api/migrate", { dry: true });
    const list = (items, empty) => items.length ? h("div", { class: "muted", style: "font-size:12px; margin:2px 0 0 22px; word-break:break-word" }, items.join(", ")) : (empty ? h("div", { class: "muted", style: "font-size:12px; margin-left:22px" }, empty) : null);
    const byClient = {};
    for (const [c, d, kind] of p.global) (byClient[c] = byClient[c] || []).push(kind === "copy" ? d : `${d} (${kind === "link" ? "link" : kind === "missing" ? "new link" : "left alone"})`);
    const replace = h("input", { type: "checkbox" });
    const relink = h("input", { type: "checkbox", checked: true });
    const global = h("input", { type: "checkbox", checked: true });
    const item = (label, n, detail) => h("div", { style: "margin:8px 0" }, h("b", {}, `${n}`), " ", label, detail);
    const ok = await openModal("Migrate from cc-switch", [
      p.ccswitch_running ? h("p", { class: "b-bad" }, "cc-switch is running. Quit it (also from the system tray), then press Check again.") : null,
      ...p.warnings.filter(w => !w.startsWith("cc-switch is running")).map(w => h("p", { class: "b-warn" }, w)),
      item("skills to copy into this program's store", p.skills_copy.length, list(p.skills_copy)),
      p.skills_done.length ? item("skills already migrated", p.skills_done.length, null) : null,
      p.skills_skip.length ? h("div", {}, item("skills with a name already used in this store", p.skills_skip.length, list(p.skills_skip)),
        h("label", { class: "row", style: "margin-left:22px" }, replace, "Replace them with cc-switch's version")) : null,
      item("MCP servers to copy (with their settings and secrets)", p.mcp_copy.length, list(p.mcp_copy)),
      p.mcp_skip.length ? item("MCP servers already in the catalog, kept", p.mcp_skip.length, list(p.mcp_skip)) : null,
      p.mcp_invalid.length ? item("MCP servers that cannot be read, skipped", p.mcp_invalid.length, list(p.mcp_invalid)) : null,
      h("label", { class: "row", style: "margin-top:12px; flex-wrap:nowrap; align-items:flex-start" }, relink, h("span", { style: "flex:1" }, h("b", {}, `Re-point ${p.relink.length} project links`), " from the cc-switch store to this program's store, so your packs keep working")),
      h("label", { class: "row", style: "margin-top:8px; flex-wrap:nowrap; align-items:flex-start" }, global, h("span", { style: "flex:1" }, h("b", {}, `Take over ${p.global.length} global skills`),
        " for Claude, OpenCode and Codex: cc-switch's copies in the agents' skill folders move to a backup folder and become links to this store")),
      ...Object.entries(byClient).map(([c, ds]) => h("div", { class: "muted", style: "font-size:12px; margin:2px 0 0 22px" }, `${CLIENT_LABEL[c]}: ${ds.join(", ")}`)),
      h("p", { class: "muted", style: "font-size:12px; margin-top:12px" },
        "Afterwards the program runs in standalone mode. Don't let cc-switch sync skills or MCP servers any more: it would write over what this program now manages."),
    ], [{ label: "Cancel" },
        p.ccswitch_running ? { label: "Check again", run: async () => { setTimeout(migrateFromCcSwitch, 0); return true; } } : null,
        { label: "Migrate", primary: true, busy: "Migrating…", run: async () => {
          if (p.ccswitch_running) throw new Error("Quit cc-switch first");
          return (S.migration = await api("/api/migrate", { dry: false, replace: replace.checked, relink: relink.checked, take_over_global: global.checked }));
        } }].filter(Boolean), true);
    if (!ok || ok === true && !S.migration) return;
    const r = S.migration; S.migration = null;
    await refresh();
    await openModal(r.errors.length ? "Migration finished with errors" : "Migration finished", [
      h("p", {}, `${plural(r.log.length, "change")} made. The program is now in standalone mode.`),
      r.backup ? h("p", { class: "muted" }, "cc-switch's copies were moved to: ", h("code", {}, r.backup)) : null,
      r.errors.length ? h("div", {}, h("h3", {}, "Errors"), h("ul", {}, ...r.errors.map(e => h("li", { class: "b-bad" }, e)))) : null,
      h("details", {}, h("summary", {}, "Full log"), h("pre", { class: "preview" }, r.log.join("\n"))),
    ], [{ label: "Close" }]);
    S.tab = "skills"; render();
  });
}

async function setMode(mode) {
  await guard(async () => { await api("/api/settings", { mode }); S.updates = null; toast(`Mode: ${mode}`); await refresh(); });
}

async function firstRun() {
  const st = S.state;
  let mode = st.ccswitch_detected ? "cc-switch" : "standalone";
  const cards = h("div", { class: "choices" });
  const draw = () => fill(cards,
    ...[["cc-switch", "I use cc-switch", st.ccswitch_detected ? "cc-switch was found on this computer. It keeps installing skills and holding MCP servers; this program manages which projects get them." : "cc-switch installs skills and holds MCP servers; this program manages which projects get them."],
        ["standalone", "I don't use cc-switch", "This program does it: install skills from git repositories (branch or release tag), keep MCP servers, and switch both on globally or per project."]]
      .map(([k, t, d]) => h("button", { class: "card choice" + (mode === k ? " sel" : ""), "aria-pressed": String(mode === k), onclick: () => { mode = k; draw(); } },
        h("b", {}, t, k === "cc-switch" && st.ccswitch_detected ? h("span", { class: "badge b-ok", style: "margin-left:8px" }, "found") : null), h("span", { class: "muted" }, d))));
  draw();
  await openModal("Welcome to Skill Pack Manager", [
    h("p", {}, "Do you use cc-switch to manage your agents' skills and MCP servers?"), cards,
    h("p", { class: "muted", style: "font-size:12px" }, "You can change this later in Settings."),
  ], [{ label: "Later" }, { label: "Continue", primary: true, run: async () => { await api("/api/settings", { mode }); } }], true);
  await refresh();
  // leaving cc-switch: offer to bring its skills and MCP servers along
  if (mode === "standalone" && st.ccswitch_detected && S.state.settings.mode === "standalone") await migrateFromCcSwitch();
}

}

  const head = h("div", { class: "row" }, h("h2", { style: "flex:1" }, "Find projects"),
    h("label", { class: "row muted" }, h("input", { type: "checkbox", checked: S.scanOnlyMissing, onchange: e => { S.scanOnlyMissing = e.target.checked; render(); } }), "Only without a pack"),

  const intro = h("p", { class: "muted" }, `Git repositories, Unity, Unreal and Godot projects, and folders that already hold linked skills, under ${S.state.config.scan_roots.join(", ")} (3 levels deep). `,

  const rows = S.scan.filter(p => (!S.scanOnlyMissing || (!p.packs.length && !p.extras.length)) && (S.scanWorktrees || !p.worktree));
  head.insertBefore(h("label", { class: "row muted" }, h("input", { type: "checkbox", checked: S.scanWorktrees, onchange: e => { S.scanWorktrees = e.target.checked; render(); } }), "Show worktrees"), head.lastChild);
  fill(d, head, intro,
    rows.length ? h("table", {}, h("thead", {}, h("tr", {}, ...["Folder", "Stack", "Packs", "Suggested", ""].map(t => h("th", {}, t)))),
      h("tbody", {}, ...rows.map(p => {

        const [sel, n] = packSelect(p.packs, sug.length ? sug[0].pack : undefined);

          h("td", { style: "word-break:break-all" }, p.folder,

          h("td", {}, h("div", { class: "chips", style: "margin:0" }, ...tags.map(t => h("span", { class: "chip" }, t)),
            p.worktree ? h("span", { class: "chip", title: "git worktree of another checkout" }, "worktree") : null,
            p.has_links && !p.packs.length ? h("span", { class: "chip b-warn", title: "Has linked skills but no pack in packs.json" }, "untracked links") : null)),
          h("td", {}, p.packs.join(", ") || h("span", { class: "b-warn" }, "none")),
          h("td", { style: "font-size:12px" }, sug.length ? sug.map(s => h("div", {}, h("b", {}, s.pack), h("span", { class: "muted" }, ` · ${s.why}`))) : h("span", { class: "muted" }, "–")),
          h("td", {}, n ? h("div", { class: "row" }, sel, h("button", { class: "btn", onclick: () => op("attach", { pack: sel.value, folder: p.folder }, `Attach ${sel.value}`).then(runScan) }, "Attach")) : null));
      }))) : h("div", { class: "empty" }, "Every project found has a pack."));

// ------------------------------------------------------------------ theme
// The server writes the saved choice into <html data-theme-pref>, so the first
// paint already has the right colors; the choice is stored server-side because
// the port, and with it the page origin and its localStorage, changes per launch.
const darkQuery = matchMedia("(prefers-color-scheme: dark)");
function applyTheme(pref) {
  if (!["light", "dark", "system"].includes(pref)) pref = "system";
  document.documentElement.dataset.themePref = pref;
  document.documentElement.dataset.theme = pref === "system" ? (darkQuery.matches ? "dark" : "light") : pref;
  for (const b of document.querySelectorAll("[data-theme-opt]")) b.setAttribute("aria-pressed", String(b.dataset.themeOpt === pref));
}
darkQuery.addEventListener("change", () => applyTheme(document.documentElement.dataset.themePref));
for (const b of document.querySelectorAll("[data-theme-opt]")) {
  b.addEventListener("click", () => {
    applyTheme(b.dataset.themeOpt);
    api("/api/settings", { theme: b.dataset.themeOpt }).catch(e => toast(`Could not save the theme: ${e.message}`, true));
  });
}
applyTheme(document.documentElement.dataset.themePref);

// ------------------------------------------------------------------- boot
$("reload").onclick = () => guard(refresh);
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("modal").style.display === "flex") $("mfoot").firstChild.click(); });
setInterval(() => api("/api/ping", {}).catch(() => {}), 5000);
api("/api/ping", {}).catch(() => {});
// closing (or reloading) the window: tell the server; it waits a few seconds for a reload
addEventListener("pagehide", () => navigator.sendBeacon("/api/bye?t=" + encodeURIComponent(TOKEN)));
// a window back from the background pings at once instead of waiting for a throttled timer
document.addEventListener("visibilitychange", () => { if (!document.hidden) api("/api/ping", {}).catch(() => {}); });
guard(refresh);
</script>
